version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # eslint-plugin-vue v10 移除 legacy .eslintrc 共享配置（plugin:vue/vue3-recommended），
      # 本站仍用 legacy .eslintrc.cjs + ESLint 8；迁移 flat config 后再解除
      - dependency-name: "eslint-plugin-vue"
        update-types: ["version-update:semver-major"]
      # 同理：ESLint 9 为 flat config 大版本，与 .eslintrc.cjs 不兼容
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # 框架升级组（#21/#22/#23 实测 peer 互锁，必须一组升 + SPA runtime 回归验证后解除）：
      # vite 6→8 + @vitejs/plugin-vue 5→6 + vue-router 4→5
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-vue"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vue-router"
        update-types: ["version-update:semver-major"]
