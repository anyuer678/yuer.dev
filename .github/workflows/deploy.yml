# GitHub Pages 部署（07 §9.1）：push main 自动构建部署到 https://anyuer678.github.io/yuer.dev/
#
# pull_request 也会跑 build job（npm ci → validate → lint → perf-budget → build），
# 使 main 的 required status check 能落在真实的 `build` check-run 上；
# deploy job 只在非 PR 事件执行，PR 不会触碰 github-pages 环境。
#
# 定时保鲜（S46）：build job 内含 sync:github（拉取最新 repo 元数据再构建），
# 每周一 03:17 UTC（北京 11:17）定时跑一次，保证案例站数据永远 ≤7 天新鲜，
# 无需手动 push 才刷新。选 17 分避开整点调度拥堵。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # 按 ref 分组：PR 上的校验不会取消正在进行的 main 部署
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Sync GitHub repo metadata
        run: npm run sync:github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run validate
      - run: npm run lint
      - name: Perf budget (public assets)
        run: npm run check:perf-budget
      - run: npm run build
      # 静态站点根标记：GitHub Pages 跳过 Jekyll 处理（07 §9.1）
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # 只在 push / workflow_dispatch / schedule 上发布；PR 上仅做校验
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
